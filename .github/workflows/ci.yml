name: .NET CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.100-preview.7

      - name: Install .NET test workload
        run: dotnet workload install test

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release --verbosity minimal

      - name: List test projects
        run: find . -name "*Tests.csproj"

      - name: Run tests
        run: |
          set -e
          for proj in $(find . -name "*Tests.csproj"); do
            echo "Running tests in $proj"
            dotnet test $proj --no-build --configuration Release --collect:"XPlat Code Coverage" --verbosity minimal
          done
