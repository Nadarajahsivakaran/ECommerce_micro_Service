name: .NET CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) Setup .NET 10 Preview
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.100-preview.7

      # 3) Install .NET test workload (useful for preview)
      - name: Install test workload
        run: dotnet workload install test

      # 4) Restore NuGet packages
      - name: Restore dependencies
        run: dotnet restore

      # 5) Build entire solution
      - name: Build solution
        run: dotnet build --no-restore --configuration Release --verbosity minimal

      # 6) Run tests per test project
      # Replace the below paths with YOUR actual test project paths
      - name: Run AuthApi tests
        run: dotnet test Auth.Tests/Auth.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"

      # - name: Run OrdersApi tests
      #   run: dotnet test Tests/OrdersApi.Tests/OrdersApi.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"

      # - name: Run PaymentsApi tests
      #   run: dotnet test Tests/PaymentsApi.Tests/PaymentsApi.Tests.csproj --configuration Release --collect:"XPlat Code Coverage"
