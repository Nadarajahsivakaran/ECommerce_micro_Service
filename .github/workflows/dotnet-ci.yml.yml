name: .NET CI + CD

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Dev
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Debug (optional but useful)
      - name: List files (debug)
        run: ls -R

      # ✅ Setup .NET (stable version)
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ✅ Restore (FIXED PATH)
      - name: Restore dependencies
        run: E_Commerce.sln --no-restore --configuration Release

        

      # ✅ Build (FIXED PATH)
      - name: Build solution
        run: dotnet build E_Commerce/E_Commerce.sln --no-restore --configuration Release

      # ✅ Test (FIXED PATH - adjust if needed)
      - name: Run tests
        run: dotnet test E_Commerce/Test/Auth.Test.csproj --configuration Release --no-build


  deploy-auth-to-azure:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/Dev'

    steps:
      # ✅ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Setup .NET
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ✅ Publish Auth API (FIXED PATH)
      - name: Publish Auth microservice
        run: dotnet publish E_Commerce/Server/AuthApi/AuthApi.csproj -c Release -o ./publish

      # ✅ Deploy to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ecommerce-auth-dev'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ./publish
